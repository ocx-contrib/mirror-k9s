# Single-package repository: every key this mirror needs is package-owned, so
# there is no `mirror-base.yml` and no `extends:` chain. That is deliberate —
# `extends:` is a SHALLOW merge of top-level keys, and `platforms:` is where it
# bites (it carries BOTH the runner matrix and the container legs, so a child
# that restates it to tweak one runner silently drops every `containers:`
# entry and nothing reds). With one spec there is nothing to merge and the trap
# does not exist. A second package here would move the genuinely repo-wide keys
# into a base — that is a content move, not a rename, and changes no generated
# workflow filename.

name: k9s

# Logical index package `k9s/k9s` at the physical path
# `ghcr.io/ocx-contrib/k9s/k9s` — slash segments, never hyphen-flattened. Two
# segments always. `derailed` is Fernand Galiana's personal handle, not a
# vendor identity, so under the fleet namespace rule the tool names itself;
# provenance lives in the claim's `upstream` block, not in the namespace. The
# first path segment must be this repo's own GitHub owner: GITHUB_TOKEN only
# authorises packages owned by the repository the workflow runs in.
target:
  registry: ghcr.io
  repository: ocx-contrib/k9s/k9s

source:
  type: github_release
  owner: derailed
  repo: k9s
  # k9s tags carry a "v" prefix (e.g. "v0.51.0"); the captured version does
  # not. The `\d+\.\d+\.\d+$` anchor is what keeps release-candidate and
  # snapshot tags out — every tag in the mirrored range is bare three-part
  # semver.
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

skip_prereleases: true
cascade: true

# Bare semver versions (`0.51.0`) carry no `+build` segment, so the fleet
# default applies with no exception. A cascade tag (`latest`, `0`, `0.51`)
# re-points on every re-publish; without a build segment the new manifest would
# reuse the bare version tag and orphan the prior digest for registry GC,
# breaking any `@sha256:` pin in a consumer's ocx.lock.
build_timestamp: date

verify:
  github_asset_digest: true

concurrency:
  # k9s is a large single Go binary: ~40 MB per compressed asset around a
  # ~130 MB uncompressed executable, so bundling is xz-bound rather than
  # network-bound. Bundle and push concurrency is held low on purpose.
  max_downloads: 4
  max_bundles: 2
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# k9s is a single static Go binary. That is the claim; below is what was
# measured, on BOTH declared arches at BOTH ends of the mirrored range, because
# a toolchain can change mid-series:
#
#   $ file v0.50.17/linux_amd64/k9s
#   ELF 64-bit LSB executable, x86-64, version 1 (SYSV), statically linked, stripped
#   $ file v0.50.17/linux_arm64/k9s
#   ELF 64-bit LSB executable, ARM aarch64, version 1 (SYSV), statically linked, stripped
#   $ file v0.51.0/linux_amd64/k9s
#   ELF 64-bit LSB executable, x86-64, version 1 (SYSV), statically linked, Go BuildID=…, stripped
#   $ file v0.51.0/linux_arm64/k9s
#   ELF 64-bit LSB executable, ARM aarch64, version 1 (SYSV), statically linked, Go BuildID=…, stripped
#
#   readelf -l <each> | grep -c INTERP        → 0   (all six: 3 versions × 2 arches)
#   readelf -d <each> | grep -c NEEDED        → 0   (all six)
#   readelf -V <each> | grep -o 'GLIBC_[0-9.]*' → (no output — no versioned
#                                                  glibc symbol references at all)
#
# No PT_INTERP, no DT_NEEDED, no GLIBC symbol versions on any of the six. The
# artifact requires NOTHING of the host userland, so both Linux keys are BARE —
# no `+libc.*` suffix. `os.features` states what an artifact REQUIRES OF THE
# HOST, not how it was built: tagging a static binary `+libc.glibc` would hide
# it from every musl host it in fact runs on, and `+libc.musl` would hide it
# from every glibc host. Neither is true here.
#
# A bare key claims universality, so it must PROVE it: the container legs below
# are ubuntu (glibc) + alpine (musl) + fedora (a different glibc vintage) on
# both arches. THE ALPINE LEG IS THE PROOF — drop it and the universal claim is
# merely asserted.
#
# ─── Scope + resolution (verified on EVERY in-range release) ────────────────
#
# The mirrored range is exactly v0.50.17, v0.50.18 and v0.51.0 — three
# releases, each carrying an IDENTICAL 38-asset set (re-listed per tag with
# `gh api repos/derailed/k9s/releases/tags/<tag> --jq '.assets[].name'`, not
# assumed from one sample). Every pattern below was matched against each of
# those three full asset lists: EXACTLY ONE match, every time, both ways. A
# pattern matching ZERO is silently skipped rather than reported as an error,
# which would yield a green run with a missing platform — so this check is not
# optional. No in-range release is asset-less, so the 0.50.17 floor needs no
# lift.
#
# Asset names here are NOT version-suffixed — `k9s_Linux_amd64.tar.gz` is
# byte-identical in NAME across every release — so "does the asset agree with
# the tag" cannot be answered from the filename. It was answered by RUNNING the
# extracted binary from each tag:
#
#   $ v0.50.17/…/k9s version --short | head -1   →  Version    v0.50.17
#   $ v0.50.18/…/k9s version --short | head -1   →  Version    v0.50.18
#   $ v0.51.0/…/k9s  version --short | head -1   →  Version    v0.51.0
#
# Each tag ships its own build; none re-ships a predecessor's binaries.
#
# THREE NAMING TRAPS, all defused by END-ANCHORING on the archive extension and
# by keeping the match CASE-SENSITIVE:
#
#   1. The OS token is Title-case for the ARCHIVES (`k9s_Linux_amd64.tar.gz`,
#      `k9s_Darwin_arm64.tar.gz`, `k9s_Windows_amd64.zip`) but LOWERCASE for
#      the package-manager siblings shipped in the SAME release
#      (`k9s_linux_amd64.apk` / `.deb` / `.rpm`). A case-insensitive pattern
#      would match both and the resolver would hard-error as ambiguous.
#   2. EVERY archive has a same-named `.sbom.json` sidecar
#      (`k9s_Linux_amd64.tar.gz.sbom.json`). A prefix-matching pattern hits two
#      assets per platform — hence the `$` on every pattern.
#   3. `k9s_Freebsd_amd64.tar.gz` / `k9s_Freebsd_arm64.tar.gz` also ship.
#      FreeBSD is not an OCX os; the literal OS token in each pattern is what
#      keeps them out.
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   k9s_Linux_armv7.tar.gz     — ocx's Architecture enum has no armv7
#   k9s_Linux_ppc64le.tar.gz   — ocx's Architecture enum has no ppc64le
#   k9s_Linux_s390x.tar.gz     — ocx's Architecture enum has no s390x
#   k9s_linux_{amd64,arm64,arm,ppc64le,s390x}.{apk,deb,rpm}  — distro sidecars
#   k9s_Freebsd_{amd64,arm64}.tar.gz                          — not an OCX os
#   *.sbom.json, checksums.sha256                             — sidecars
# ocx expresses exactly amd64 and arm64, so armv7/ppc64le/s390x are upstream
# assets rather than declarable platforms — nothing to gate, nothing to exclude
# beyond not naming them.
assets:
  linux/amd64:
    - "^k9s_Linux_amd64\\.tar\\.gz$"
  linux/arm64:
    - "^k9s_Linux_arm64\\.tar\\.gz$"
  # ── Pass 2 (darwin) ───────────────────────────────────────────────────────
  # Uncommented in lockstep with the matching `platforms:` keys below. A
  # declared platform with no resolvable asset does NOT red — it boots a real
  # macOS/Windows runner and reports SUCCESS having tested nothing — so the
  # asset regex and its platform key move in the SAME pass.
  # darwin/amd64:
  #   - "^k9s_Darwin_amd64\\.tar\\.gz$"
  # darwin/arm64:
  #   - "^k9s_Darwin_arm64\\.tar\\.gz$"
  # ── Pass 3 (windows) ──────────────────────────────────────────────────────
  # windows/amd64:
  #   - "^k9s_Windows_amd64\\.zip$"
  # windows/arm64:
  #   - "^k9s_Windows_arm64\\.zip$"

# Every archive — tarball and zip alike — is FLAT: `k9s` (`k9s.exe` on Windows)
# sits at the archive root beside `LICENSE` and `README.md`, with no wrapper
# directory and no `bin/`. Verified with `tar tvzf` / `unzip -l` on 0.50.17 and
# 0.51.0, linux + darwin + windows:
#
#   -rw-r--r--     10174  LICENSE
#   -rw-r--r--     64086  README.md
#   -rwxr-xr-x 132063394  k9s
#
# So strip_components 0 on every platform — the binary lands at the content
# root — and one metadata.json (PATH = ${installPath}) serves all six.
# NOTE the two shapes that both take 0 and mean opposite things: a FLAT archive
# (this one) keeps the binary at ${installPath}; an archive WITH a top
# directory keeps that directory, making PATH ${installPath}/<topdir>. The
# `tar tvzf` transcript above is what distinguishes them.
asset_type:
  type: archive
  strip_components: 0

# FORCED by the flat archive, not chosen. `bin_scan` only inspects an
# interface-visible `${installPath}/<dir>` PATH entry, and this archive has no
# subdirectory to point one at, so both `auto` and `verify` fail spec load at
# exit 65:
#
#   bin_scan is enabled but metadata.json declares no interface-visible
#   ${installPath}/<dir> PATH entry — the verification would inspect no file
#   and pass green whatever the archive contains.
#
# The `binaries` list in metadata.json is therefore hand-maintained, exactly as
# that error directs. It is short and stable: `k9s` (`k9s.exe` on Windows) is
# the only mode-0755 entry in the archive; `LICENSE` and `README.md` are 0644
# data. Quoted so no YAML 1.1 reader folds the bare word into boolean `false`.
bin_scan: "off"

metadata:
  default: metadata.json

catalog:
  logo: logo.svg

versions:
  # Assigned floor for this mirror. Every release from here up resolves both
  # declared Linux platforms (and, from pass 2/3, both darwin and both windows
  # platforms) with exactly one asset each.
  min: "0.50.17"
  new_per_run: 5
  poll_interval: "28 */6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: k9s/tests/smoke.star

# ─── Runner + container matrix ─────────────────────────────────────────────
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  linux/arm64:
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  # ── Pass 2 (darwin) ───────────────────────────────────────────────────────
  # darwin/amd64:
  #   # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 —
  #   # GitHub's native macos-13 Intel pool is exhausted and deadlocks push.
  #   runner: macos-14
  #   prefix: ["arch", "-x86_64"]
  # darwin/arm64:
  #   runner: macos-14
  #   shell: bash
  # ── Pass 3 (windows) ──────────────────────────────────────────────────────
  # windows/amd64:
  #   runner: windows-latest
  #   shell: pwsh
  # windows/arm64:
  #   # Native arm64 Windows runner — the amd64 pool cannot execute an ARM64
  #   # PE, and upstream does ship k9s_Windows_arm64.zip on every in-range
  #   # release, so this leg resolves an asset and must exist here or push
  #   # reds it as missing_junit.
  #   runner: windows-11-arm
  #   shell: pwsh
  #
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/derailed/k9s/license --jq '.license.spdx_id'
  #   Apache-2.0
  org.opencontainers.image.licenses: "Apache-2.0"

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: k9s/k9s
  fork: ocx-contrib/index
